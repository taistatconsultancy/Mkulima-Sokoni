<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline · Mkulima Sokoni</title>
<meta name="theme-color" content="#1B4332" />
<link rel="icon" type="image/jpeg" href="/assets/img/logo.jpeg" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{min-height:100vh;display:grid;place-items:center;background:#FAF6EF;color:#1A1A18;font-family:system-ui,'DM Sans',sans-serif;padding:24px;}
  .card{max-width:440px;width:100%;background:#fff;border:1.5px solid #DDD8CE;border-radius:18px;padding:26px;box-shadow:0 12px 36px rgba(27,67,50,.12);text-align:center;}
  .logo{width:68px;height:68px;border-radius:16px;overflow:hidden;background:#fff;margin:0 auto 14px;box-shadow:0 4px 14px rgba(27,67,50,.18);display:grid;place-items:center;}
  .logo img{width:100%;height:100%;object-fit:contain;}
  h1{font-size:1.3rem;color:#1B4332;margin-bottom:6px;}
  p{color:#6B705C;font-size:.92rem;line-height:1.55;margin-bottom:18px;}
  button{background:#1B4332;color:#fff;border:none;border-radius:100px;padding:12px 22px;font-weight:600;cursor:pointer;font-size:.9rem;}
  button:hover{background:#40916C;}
  .hint{margin-top:10px;font-size:.78rem;color:#6B705C;}
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="/assets/img/logo.jpeg" alt="Mkulima Sokoni" /></div>
    <h1>You're offline</h1>
    <p>Mkulima Sokoni needs an internet connection to load fresh listings, messages, and orders. Please reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
    <div class="hint">The app shell is cached so it loads instantly when you’re back online.</div>
  </div>
</body>
</html>
