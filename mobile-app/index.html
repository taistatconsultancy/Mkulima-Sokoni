<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2f855a" />
  <title>Mkulima Sokoni Mobile</title>
  <link rel="manifest" href="/mobile-app/manifest.json" />
  <link rel="icon" href="/mobile-app/assets/icons/icon-192.svg" />
  <link rel="stylesheet" href="/mobile-app/css/mobile.css" />
  <link rel="stylesheet" href="/css/site-chrome.css" />
  <script>
    window.si = window.si || function () { (window.si.q = window.si.q || []).push(arguments) };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-row">
        <div class="brand">Mkulima Sokoni Mobile</div>
        <span class="pill" id="rolePill">Role: buyer</span>
      </div>
      <div class="tabs" id="roleTabs">
        <button class="tab-btn active" data-role="buyer">Buyer</button>
        <button class="tab-btn" data-role="farmer">Farmer</button>
        <button class="tab-btn" data-role="agro-dealer">Agro-dealer</button>
      </div>
    </header>

    <main class="content" id="screenRoot"></main>

    <div class="sticky-cta" id="stickyCta" style="display:none;">
      <button class="btn primary" id="stickyActionBtn">Action</button>
    </div>

    <footer class="site-bottom-bar site-bottom-bar--light site-app-footer" aria-label="Site links">
      <div class="site-social-links">
        <a href="https://www.facebook.com/profile.php?id=61590622072682" target="_blank" rel="noopener noreferrer" aria-label="Mkulima Sokoni on Facebook">
          <img src="/assets/img/icons/facebook.svg" alt="" />
        </a>
        <a href="https://www.tiktok.com/@mkulimasokoni" target="_blank" rel="noopener noreferrer" aria-label="Mkulima Sokoni on TikTok">
          <img src="/assets/img/icons/tiktok.svg" alt="" />
        </a>
      </div>
      <a class="site-powered-by" href="https://taistat.com/" target="_blank" rel="noopener noreferrer">
        <img src="/assets/img/taistat-logo.png" alt="TaiStat Firm" />
        <span>Powered by TaiStat Firm</span>
      </a>
    </footer>
  </div>

  <script src="/mobile-app/js/api-client.js"></script>
  <script src="/mobile-app/js/mobile-shell.js"></script>
  <script src="/js/site-chrome.js"></script>
</body>
</html>
